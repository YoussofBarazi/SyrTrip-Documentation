info:
  name: Get Owner Bookings (Admin or Hotel, Office, Restaurant Owners)
  type: http
  seq: 3

http:
  method: GET
  url: "{{Host}}/api/bookings/owner-bookings"
  headers:
    - name: Authorization
      value: Bearer {{Token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
