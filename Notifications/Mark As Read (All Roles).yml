info:
  name: Mark As Read (All Roles)
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{Host}}/api/notifications/{{notification_id}}/read"
  headers:
    - name: Authorization
      value: Bearer {{Token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
