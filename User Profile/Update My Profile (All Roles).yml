info:
  name: Update My Profile (All Roles)
  type: http
  seq: 2

http:
  method: PUT
  url: "{{Host}}/api/users/me"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{Token}}
  body:
    type: json
    data: |-
      {
        "name": "Youssof",
        "phone": "+963922222222"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
