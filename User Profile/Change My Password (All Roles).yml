info:
  name: Change My Password (All Roles)
  type: http
  seq: 3

http:
  method: PUT
  url: "{{Host}}/api/users/me/password"
  headers:
    - name: Authorization
      value: Bearer {{Token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "oldPassword": "12345678",
        "newPassword": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
