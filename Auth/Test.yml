http:
  method: GET
  url: "{{Host}}/api/auth/me"
  headers:
    - name: Authorization
      value: Bearer {{Token}}
  auth: inherit

runtime:
  variables:
    - name: host
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
