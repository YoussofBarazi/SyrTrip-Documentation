info:
  name: Register
  type: http
  seq: 2

http:
  method: POST
  url: "{{Host}}/api/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "customer@example.com", // test@example.com
        "password": "12345678", // ******
        "name": "Mohammad Nour", // Mohammad Nour
        "phone": "0912345678" // +9639XXXXXXXX
      }
  auth: inherit

runtime:
  variables:
    - name: host
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
