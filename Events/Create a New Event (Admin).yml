info:
  name: Create a New Event (Admin)
  type: http
  seq: 3

http:
  method: POST
  url: "{{Host}}/api/events"
  headers:
    - name: Authorization
      value: Bearer {{Token}}
  body:
    type: json
    data: |-
      {
        "name": "المعرض الدولي للذكاء الاصطناعي",
        "type": "علمي",
        "description": "الموسم الثاني من المعرض",
        "startDate": "2026-09-01",
        "endDate": "2026-09-05",
        "time": "09:00",
        "price": 0,
        "location": "حماه",
        "lat": 35.234,
        "lng": 36.354,
        "images": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
