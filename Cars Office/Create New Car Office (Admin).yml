http:
  method: POST
  url: https://syr-trip-backend.vercel.app/api/offices
  headers:
    - name: Authorization
      value: Bearer {{Token}}
  body:
    type: json
    data: |-
      {
        "ownerEmail": "office2@example.com", // 
        "name": "Al-Sabuneyah", //
        "description": "", // optional
        "location": "Hama", //
        "lat": 35.14848844178197, // number
        "lng": 36.75109873468448, // number
        "phone": "0951763256" // 
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
